name: Audio Acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 1-5"

concurrency:
  group: audio-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    timeout-minutes: 45
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: workers/audio-engine/requirements*.txt

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Install audio worker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r workers/audio-engine/requirements.txt

      - name: Run audio acceptance suite
        run: bun run audit:audio:acceptance

      - name: Upload audio acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-acceptance-reports
          path: |
            workers/audio-engine/tools/reports/audio-closure.md
            workers/audio-engine/tools/reports/audio-acceptance.md
            workers/audio-engine/tools/reports/audio-acceptance.json
          if-no-files-found: warn

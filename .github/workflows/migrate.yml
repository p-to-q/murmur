name: Migrate (production)

# Vercel's native Git integration already deploys Production + Preview on every
# push to main, so this workflow does NOT deploy — it only runs database
# migrations, the one thing the native deploy does not do. That closes the
# migration-drift gap (new code shipping before the prod schema catches up)
# without duplicating the deploy.
#
# Required secret:
#   DATABASE_URL_UNPOOLED — direct (non-pooled) prod connection string used to
#                           apply migrations. Until it is set this workflow is a
#                           no-op (stays green), so committing it changes nothing
#                           about prod until you opt in.
#
# Migrations run in parallel with the native deploy. For the additive
# (ADD COLUMN IF NOT EXISTS) migrations this repo uses, a brief overlap is
# harmless and far better than migrations never running.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice title=Migrations skipped::DATABASE_URL_UNPOOLED secret not set."
            exit 0
          fi
          bun run db:migrate

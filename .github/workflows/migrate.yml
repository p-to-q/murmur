name: Release (production)

# This is the only production release path. Vercel's native Git integration
# must keep Preview deployments enabled and Production auto-deploys disabled.
# A maintainer dispatches an exact, CI-green main SHA. The protected Production
# environment approves that SHA before any migration runs, then releases it in
# this order: validate -> approve -> migrate -> verify -> deploy -> smoke.

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main-branch commit SHA to release
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.release_sha }}
  VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME || 'murmur' }}
  VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'moapachas-projects' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout protected release gate
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Verify exact main SHA and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-verify-main.ts

  approve:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      - name: Record approved release SHA
        run: echo "Approved production release for $RELEASE_SHA"

  migrate:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout protected release gate
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Verify exact main SHA and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/release-verify-main.ts
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Validate migration configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          VERCEL_NATIVE_PRODUCTION_DISABLED: ${{ vars.VERCEL_NATIVE_PRODUCTION_DISABLED }}
        run: |
          if [ "${VERCEL_NATIVE_PRODUCTION_DISABLED:-}" != "true" ]; then
            echo "::error title=Production release cutover is not acknowledged::Disable Vercel native Production auto-deploy for main, retain Preview, then set VERCEL_NATIVE_PRODUCTION_DISABLED=true."
            exit 1
          fi
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error title=Production migration is not configured::Set DATABASE_URL_UNPOOLED to the direct production Postgres connection string."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply production migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: bun run db:migrate

  verify:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify schema convergence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: bun run db:migrate

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Validate Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for value in VERCEL_TOKEN VERCEL_PROJECT_NAME VERCEL_SCOPE; do
            if [ -z "${!value:-}" ]; then
              echo "::error title=Vercel release is not configured::Set ${value} before releasing."
              exit 1
            fi
          done

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bunx vercel@56.3.1 link --yes \
            --project "$VERCEL_PROJECT_NAME" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Deploy exact release SHA
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(bunx vercel@56.3.1 deploy --prod --yes \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --meta githubCommitSha="$RELEASE_SHA" \
            --meta githubCommitRef=main | tail -n 1)"
          case "$deployment_url" in
            https://*) ;;
            *) echo "::error title=Vercel deployment failed::Unexpected deployment URL: ${deployment_url}"; exit 1 ;;
          esac
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Released $RELEASE_SHA to $deployment_url"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Smoke production alias
        run: bun scripts/release-production-smoke.ts https://murmur.ptoq.io

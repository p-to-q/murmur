name: Migrate (production)

# Vercel's native Git integration already deploys Production + Preview on every
# push to main, so this workflow does NOT deploy — it only runs database
# migrations, the one thing the native deploy does not do. That closes the
# migration-drift gap (new code shipping before the prod schema catches up)
# without duplicating the deploy.
#
# Required secret:
#   DATABASE_URL_UNPOOLED — direct (non-pooled) prod connection string used to
#                           apply migrations. The workflow fails closed when the
#                           secret is absent so a green run always means the
#                           migration command was actually attempted.
#
# Migrations currently run in parallel with the native deploy. This workflow
# does not claim that overlap is safe for every migration; ordered
# migrate-before-deploy promotion is tracked separately in issue #307.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate migration configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error title=Production migration is not configured::Set the DATABASE_URL_UNPOOLED repository secret to the direct production Postgres connection string."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: bun run db:migrate

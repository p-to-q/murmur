name: Migrate (production)

# Vercel's native Git integration already deploys Production + Preview on every
# push to main, so this workflow does NOT deploy — it only runs database
# migrations, the one thing the native deploy does not do. That closes the
# migration-drift gap (new code shipping before the prod schema catches up)
# without duplicating the deploy.
#
# Required secret:
#   DATABASE_URL_UNPOOLED — direct (non-pooled) prod connection string used to
#                           apply migrations. The workflow fails closed when the
#                           secret is absent so a green run always means the
#                           migration command was actually attempted.
#
# By default this workflow only migrates, because Vercel's native Git
# integration may still own Production deploys. Once the repo owner disables
# native Production auto-deploy for main, set the repository variable
# VERCEL_DEPLOY_AFTER_MIGRATE=true and the secret VERCEL_DEPLOY_HOOK_URL to
# promote Production only after migrations succeed (issue #307).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate migration configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error title=Production migration is not configured::Set the DATABASE_URL_UNPOOLED repository secret to the direct production Postgres connection string."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: bun run db:migrate

      - name: Trigger Vercel production deploy after migrations
        env:
          VERCEL_DEPLOY_AFTER_MIGRATE: ${{ vars.VERCEL_DEPLOY_AFTER_MIGRATE }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ "${VERCEL_DEPLOY_AFTER_MIGRATE:-}" != "true" ]; then
            echo "::notice title=Production deploy not triggered::Set VERCEL_DEPLOY_AFTER_MIGRATE=true only after disabling Vercel native Production auto-deploy for main."
            exit 0
          fi

          if [ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error title=Vercel deploy hook is not configured::Set VERCEL_DEPLOY_HOOK_URL before enabling VERCEL_DEPLOY_AFTER_MIGRATE."
            exit 1
          fi

          curl --fail-with-body --show-error --silent --request POST "${VERCEL_DEPLOY_HOOK_URL}"

name: Performance Budget

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'next.config.*'

permissions:
  contents: read
  pull-requests: write

jobs:
  check-bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build
        env:
          # Skip type checking in performance check
          SKIP_TYPE_CHECK: true

      - name: Check bundle sizes
        id: bundle-check
        run: |
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check non-media static size. Next emits large CJK font shards under
          # .next/static/media, so those are reported separately below.
          if [ -d .next/static ]; then
            STATIC_SIZE=$(find .next/static -path .next/static/media -prune -o -type f -print0 | xargs -0 du -k 2>/dev/null | awk '{sum += $1} END {print sum + 0}')
            STATIC_SIZE_MB=$(echo "scale=2; $STATIC_SIZE / 1024" | bc)
            echo "- Static assets: ${STATIC_SIZE_MB} MB" >> $GITHUB_STEP_SUMMARY

            MAX_STATIC_SIZE=16384  # 16MB for JS/CSS/static. Fonts are excluded because they live in media shards.
            if [ $STATIC_SIZE -gt $MAX_STATIC_SIZE ]; then
              echo "::error::Static bundle size (${STATIC_SIZE_MB} MB) exceeds limit (16 MB)"
              exit 1
            fi
          fi

          if [ -d .next/static/media ]; then
            MEDIA_SIZE=$(du -sk .next/static/media | cut -f1)
            MEDIA_SIZE_MB=$(echo "scale=2; $MEDIA_SIZE / 1024" | bc)
            echo "- Static media/fonts: ${MEDIA_SIZE_MB} MB" >> $GITHUB_STEP_SUMMARY
          fi

          # Check individual JS chunks
          if [ -d .next/static/chunks ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Largest chunks:" >> $GITHUB_STEP_SUMMARY
            du -h .next/static/chunks/*.js 2>/dev/null | sort -hr | head -5 | while read size file; do
              echo "- $(basename $file): $size" >> $GITHUB_STEP_SUMMARY
            done
          fi

          # Check page sizes
          if [ -d .next/server/pages ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Page bundle sizes:" >> $GITHUB_STEP_SUMMARY
            find .next/server/pages -name "*.js" -type f -exec du -h {} \; | sort -hr | head -5 | while read size file; do
              echo "- $(basename $file): $size" >> $GITHUB_STEP_SUMMARY
            done
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary + '\n\n✅ Bundle size within limits'
            });

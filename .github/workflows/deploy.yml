name: Deploy (production)

# Auto-deploy to Vercel on every push to main. Replaces the manual
# `vercel --prod` habit. Runs DB migrations first so the schema never lags
# behind the deployed code (the migration-drift class of incidents).
#
# Required secret (mint at https://vercel.com/account/tokens, team scope):
#   VERCEL_TOKEN          — the only secret you must add by hand
# Preloaded secrets (already set):
#   VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   DATABASE_URL_UNPOOLED — enables the pre-deploy migration step; remove the
#                           secret to skip auto-migrations.
#
# Until VERCEL_TOKEN exists the deploy job is skipped (this workflow stays
# green), so committing it changes nothing about prod until you opt in.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    # Secrets can't be read in a job-level `if:`, so a tiny job converts the
    # presence of VERCEL_TOKEN into an output the deploy job can branch on.
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Auto-deploy idle::Set the VERCEL_TOKEN repo secret to enable production deploys."
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice title=Migrations skipped::DATABASE_URL_UNPOOLED secret not set."
            exit 0
          fi
          bun run db:migrate

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

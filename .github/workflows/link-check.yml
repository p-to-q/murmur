name: Link Check

on:
  workflow_dispatch:
  schedule:
    - cron: "13 6 1 * *"

permissions:
  contents: read

jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Check local markdown links
        run: node scripts/check-links.mjs

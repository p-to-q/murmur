name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Audio worker tests
        run: bun run test:audio

      - name: Install audio worker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r workers/audio-engine/requirements.txt

      - name: Full audio worker tests
        run: bun run test:audio:full

      - name: Build
        run: bun run build

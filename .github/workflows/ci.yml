name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: workers/audio-engine/requirements*.txt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install audio worker dependencies
        run: |
          cd workers/audio-engine
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt

      - name: Lint
        run: bun run lint

      - name: Check local markdown links
        run: bun run check:links

      - name: Test
        run: bun test

      - name: Audio worker tests
        run: bun run test:audio

      - name: Build audit
        run: bun run build:audit

      - name: Local stack smoke
        run: bash scripts/ci-local-stack-smoke.sh

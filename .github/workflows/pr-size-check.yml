name: PR Size Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  check-size:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const additions = pr.additions;
            const deletions = pr.deletions;
            const changes = additions + deletions;
            const files = pr.changed_files;

            let label = null;
            let emoji = '';
            let message = '';

            if (changes > 1000) {
              label = 'size/XL';
              emoji = '🔴';
              message = 'This PR is very large. Consider breaking it into smaller PRs for easier review.';
            } else if (changes > 500) {
              label = 'size/L';
              emoji = '🟠';
              message = 'This PR is large. Consider if it can be split into smaller pieces.';
            } else if (changes > 200) {
              label = 'size/M';
              emoji = '🟡';
              message = 'This PR is medium-sized.';
            } else if (changes > 50) {
              label = 'size/S';
              emoji = '🟢';
              message = 'This PR is small and easy to review.';
            } else {
              label = 'size/XS';
              emoji = '🔵';
              message = 'This PR is tiny and quick to review.';
            }

            // Remove old size labels
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const oldLabel of labels.data) {
              if (oldLabel.name.startsWith('size/')) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: oldLabel.name,
                });
              }
            }

            // Add new size label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            });

            // Post comment
            const body = `${emoji} **PR Size: ${label}**\n\n` +
              `📊 Stats:\n` +
              `- ${additions} additions\n` +
              `- ${deletions} deletions\n` +
              `- ${changes} total changes\n` +
              `- ${files} files changed\n\n` +
              `${message}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

            // Fail if too large (optional - remove if you don't want to block)
            if (changes > 1500) {
              core.setFailed(`PR is too large (${changes} changes). Maximum recommended: 1500 lines.`);
            }

# Builds the music-engine image (RunPod Serverless handler) and makes the GHCR
# package public so the serverless endpoint can pull it without registry auth.
name: Music engine image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - workers/music-engine/**
      - .github/workflows/music-engine-gpu-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        # The CUDA + magenta-rt[jax] + jax[cuda12] image is multi-GB; the runner's
        # ~14 GB free disk overflows mid-build (and on cache export) whenever the
        # pip layer rebuilds. Reclaim ~25 GB of preinstalled toolchains we don't use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: workers/music-engine
          file: workers/music-engine/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/murmur-music-engine:latest
            ghcr.io/${{ github.repository_owner }}/murmur-music-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Make GHCR package public (RunPod pulls without registry auth)
        continue-on-error: true
        run: |
          gh api --method PATCH \
            "/orgs/${{ github.repository_owner }}/packages/container/murmur-music-engine" \
            -f visibility=public
        env:
          GH_TOKEN: ${{ github.token }}

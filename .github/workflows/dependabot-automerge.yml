name: Dependabot Auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Only runs on Dependabot PRs that are grouped minor/patch updates
    if: |
      github.actor == 'dependabot[bot]' && (
        startsWith(github.head_ref, 'dependabot/npm_and_yarn/next-stack-') ||
        startsWith(github.head_ref, 'dependabot/npm_and_yarn/aws-sdk-') ||
        startsWith(github.head_ref, 'dependabot/npm_and_yarn/tailwind-stack-') ||
        startsWith(github.head_ref, 'dependabot/pip/pip-minor-patch-') ||
        startsWith(github.head_ref, 'dependabot/github_actions/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}

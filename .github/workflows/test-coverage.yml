name: Test Coverage

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install music quality contract dependencies
        run: python -m pip install "numpy>=1.26,<3"

      - name: Run tests with coverage
        run: NODE_ENV=test bun test --coverage

      - name: Coverage report
        if: github.event_name == 'pull_request'
        run: |
          echo "## 📊 Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage report will be available once tests generate coverage data." >> $GITHUB_STEP_SUMMARY

# Fly.io deploy for the Murmur audio-engine (transcription worker).
#
# An always-on single small CPU machine with a stable URL
# (https://<app>.fly.dev) — this replaces the home-Mac + cloudflared
# quick-tunnel setup so production transcription no longer depends on a
# laptop being awake. Deploy:  fly deploy -c workers/audio-engine/fly.toml
app = "murmur-audio"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Container disk is ephemeral; don't try to persist captured hums here.
  MURMUR_CAPTURE_HUMS = "0"
  # The Docker image bakes this file during build; keep Fly explicit so /health
  # and runtime logs match the production pitch route.
  AUDIO_ENGINE_PITCH_PROVIDER = "auto"
  AUDIO_ENGINE_RMVPE_MODEL_PATH = "/app/models/rmvpe.onnx"
  AUDIO_ENGINE_RMVPE_DEVICE = "cpu"
  AUDIO_ENGINE_RMVPE_ALLOW_DOWNLOAD = "0"
  AUDIO_ENGINE_RMVPE_CONFIDENCE_THRESHOLD = "0.03"
  AUDIO_WORKER_REQUIRE_AUTH = "1"

[http_service]
  internal_port = 8001
  force_https = true
  # Keep one machine always warm: RMVPE/SwiftF0 model warmup should happen
  # before users are waiting on a hum transcription.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "40s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
